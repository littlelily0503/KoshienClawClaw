name: 更新賽果

on:
  schedule:
    # cron 用 UTC，台灣時間 = UTC + 8。23:00 + 00:00-15:00 UTC = 台灣 07:00-23:00。
    #
    # 兩個刻意的設計：
    # 1. 避開整點。全世界的 cron 都擠在 :00，那是 GitHub 負載最高、
    #    排程最容易被丟棄的一分鐘。改用 :07 / :37 這種冷門分鐘命中率高得多。
    # 2. 每小時給兩個觸發機會。單一觸發被丟掉就等於整整一小時沒更新，
    #    半小時一次可以把最壞情況砍半。
    - cron: "7,37 23,0-15 * 8 *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: true     # 下一個整點接手時，直接取代還在跑的上一趟

env:
  RUN_SECONDS: 2100            # 這一趟總共跑多久（秒）。35 分鐘，略長於觸發間隔以確保銜接
  INTERVAL: 600                # 每次抓取的間隔（秒）。10 分鐘

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      - name: 迴圈抓取
        run: |
          set -euo pipefail

          git config user.name  "koshien-bot"
          git config user.email "actions@github.com"

          DEADLINE=$(( $(date +%s) + RUN_SECONDS ))
          n=0

          while :; do
            n=$((n+1))
            echo "::group::第 $n 趟　$(TZ=Asia/Taipei date '+%m/%d %H:%M') 台灣時間"

            # 每趟都從遠端最新狀態開始。
            # results.json / results.js 由 bot 完整重新產生，不需要合併，
            # 因此用 reset 而非 rebase，永遠不會出現衝突或 rebase 中斷。
            git fetch -q origin main
            git reset -q --hard origin/main

            if ! python fetch_results.py -o results.json; then
              echo "抓取失敗，本趟略過"
            elif git diff --quiet -- results.json results.js; then
              echo "賽果無變動"
            else
              git add results.json results.js
              git commit -qm "賽果更新 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
              if git push -q origin main; then
                echo "已推送"
              else
                echo "推送被拒（遠端剛好有新 commit），下一趟會重新抓取並重試"
              fi
            fi

            echo "::endgroup::"

            now=$(date +%s)
            if [ $(( now + INTERVAL )) -ge $DEADLINE ]; then
              break
            fi
            sleep "$INTERVAL"
          done

          echo "收工，本趟共執行 $n 次抓取"
