name: 更新賽果

on:
  schedule:
    # ─── 抓取時段與頻率就是這一行。cron 用 UTC，台灣時間 = UTC + 8 ───
    # 目前：23:00 + 00:00-13:00 UTC = 台灣 07:00-21:00，每 10 分鐘一次
    - cron: "*/10 23,0-13 * 8 *"
    #
    # 參考：日本時間 = 台灣 + 1 小時
    #   當天第1試合  08:00 JST 開打 = 台灣 07:00，約 10:15 JST 結束 = 台灣 09:15
    #   當天第4試合  18:30 JST 開打 = 台灣 17:30，約 20:45 JST 結束 = 台灣 19:45
    #
    # 其他選擇：
    #   台灣 09:00-23:00           →  "*/10 1-15 * 8 *"
    #   台灣 07:00-23:00（含緩衝）  →  "*/10 23,0-15 * 8 *"
    #   每小時一次而非每 10 分鐘    →  "0 23,0-13 * 8 *"

  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      - name: 抓取賽果
        run: python fetch_results.py -o results.json

      - name: 有變動才 commit
        run: |
          if git diff --quiet -- results.json results.js; then
            echo "賽果無變動，略過"
            exit 0
          fi
          git config user.name  "koshien-bot"
          git config user.email "actions@github.com"
          git add results.json results.js
          git commit -m "賽果更新 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git push
