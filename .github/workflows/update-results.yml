name: 更新賽果

on:
  schedule:
    # 每小時只請 GitHub 觸發「一趟」，進去之後自己迴圈跑滿約 50 分鐘。
    # 高頻 cron（*/10）在免費方案會被大量丟棄，整點單趟的成功率高得多。
    # 23:00 + 00:00-13:00 UTC = 台灣 07:00-21:00
    - cron: "0 23,0-13 * 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: true     # 下一個整點接手時，直接取代還在跑的上一趟

env:
  RUN_SECONDS: 3000            # 這一趟總共跑多久（秒）。50 分鐘
  INTERVAL: 600                # 每次抓取的間隔（秒）。10 分鐘

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      - name: 迴圈抓取
        run: |
          set -euo pipefail

          git config user.name  "koshien-bot"
          git config user.email "actions@github.com"

          DEADLINE=$(( $(date +%s) + RUN_SECONDS ))
          n=0

          while :; do
            n=$((n+1))
            echo "::group::第 $n 趟　$(TZ=Asia/Taipei date '+%m/%d %H:%M') 台灣時間"

            # 每趟都從遠端最新狀態開始。
            # results.json / results.js 由 bot 完整重新產生，不需要合併，
            # 因此用 reset 而非 rebase，永遠不會出現衝突或 rebase 中斷。
            git fetch -q origin main
            git reset -q --hard origin/main

            if ! python fetch_results.py -o results.json; then
              echo "抓取失敗，本趟略過"
            elif git diff --quiet -- results.json results.js; then
              echo "賽果無變動"
            else
              git add results.json results.js
              git commit -qm "賽果更新 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
              if git push -q origin main; then
                echo "已推送"
              else
                echo "推送被拒（遠端剛好有新 commit），下一趟會重新抓取並重試"
              fi
            fi

            echo "::endgroup::"

            now=$(date +%s)
            if [ $(( now + INTERVAL )) -ge $DEADLINE ]; then
              break
            fi
            sleep "$INTERVAL"
          done

          echo "收工，本趟共執行 $n 次抓取"
